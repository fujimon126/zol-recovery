<title>ゾール回収量記録</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #eef1ef;
    --surface: #ffffff;
    --surface-2: #e3e8e5;
    --surface-3: #d5dcd8;
    --text: #1b2422;
    --text-muted: #5c6864;
    --border: #ccd4d0;
    --accent: #c9631a;
    --accent-strong: #a84f11;
    --accent-text: #fffaf5;
    --good: #2f7f52;
    --good-bg: #e3f1e7;
    --warn: #9a6d0c;
    --warn-bg: #f6ecd6;
    --danger: #b23b2e;
    --danger-bg: #fbe8e4;
    --shadow: 0 1px 2px rgba(20,30,26,0.06), 0 4px 14px rgba(20,30,26,0.06);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14191a;
      --surface: #1d2425;
      --surface-2: #262f30;
      --surface-3: #333e3f;
      --text: #e9ede9;
      --text-muted: #9aa8a3;
      --border: #35403f;
      --accent: #ef8a3e;
      --accent-strong: #ffa662;
      --accent-text: #1a1000;
      --good: #55c48a;
      --good-bg: #16332376;
      --warn: #e2b64c;
      --warn-bg: #3a2f0f;
      --danger: #ef7466;
      --danger-bg: #3a1c17;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14191a; --surface: #1d2425; --surface-2: #262f30; --surface-3: #333e3f;
    --text: #e9ede9; --text-muted: #9aa8a3; --border: #35403f;
    --accent: #ef8a3e; --accent-strong: #ffa662; --accent-text: #1a1000;
    --good: #55c48a; --good-bg: #16332376; --warn: #e2b64c; --warn-bg: #3a2f0f;
    --danger: #ef7466; --danger-bg: #3a1c17;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #eef1ef; --surface: #ffffff; --surface-2: #e3e8e5; --surface-3: #d5dcd8;
    --text: #1b2422; --text-muted: #5c6864; --border: #ccd4d0;
    --accent: #c9631a; --accent-strong: #a84f11; --accent-text: #fffaf5;
    --good: #2f7f52; --good-bg: #e3f1e7; --warn: #9a6d0c; --warn-bg: #f6ecd6;
    --danger: #b23b2e; --danger-bg: #fbe8e4;
    --shadow: 0 1px 2px rgba(20,30,26,0.06), 0 4px 14px rgba(20,30,26,0.06);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  /* header */
  header.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand .mark {
    width: 10px; height: 10px; border-radius: 3px;
    background: var(--accent);
    flex: none;
    margin-bottom: 2px;
  }
  .brand h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }
  .sync-pill {
    margin-left: auto;
    flex: none;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    cursor: pointer;
    white-space: nowrap;
    background: var(--surface-2);
    color: var(--text-muted);
  }
  .sync-pill.ok { background: var(--good-bg); color: var(--good); }
  .sync-pill.warn { background: var(--warn-bg); color: var(--warn); }
  .sync-pill.err { background: var(--danger-bg); color: var(--danger); }
  .sync-pill.busy { background: var(--surface-3); color: var(--text-muted); }
  .factory-switch {
    margin-top: 10px;
  }
  select.factory-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--surface-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%235c6864" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 12px center;
    background-size: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    padding: 10px 34px 10px 12px;
  }

  main {
    flex: 1;
    padding: 16px 16px 96px;
  }
  .hidden { display: none !important; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .card + .card { margin-top: 12px; }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  /* stats strip */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .stat .label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .stat .value .unit { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-left: 2px; }
  .stat.accent {
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
  }
  .stat.accent .value { color: var(--accent-strong); }
  .stat.accent .value .unit { color: var(--accent-strong); opacity: 0.75; }

  /* machine grid */
  .scope-note {
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-muted);
    margin: -4px 2px 12px;
  }

  .machine-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .machine-btn {
    text-align: left;
    background: var(--surface-2);
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .machine-btn .name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
  .machine-btn .num { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .machine-btn.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--surface-2));
  }
  .machine-btn.active .name { color: var(--accent-strong); }
  .empty-note {
    font-size: 13px;
    color: var(--text-muted);
    padding: 6px 2px;
  }

  .machine-cum {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .mc-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin: 0 0 8px;
  }
  .mc-title .mc-n { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .mc-grid.mc-grid-3 { grid-template-columns: repeat(3, 1fr); }
  .mc-note {
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-muted);
    margin: 8px 2px 0;
  }
  .mc-grid > div {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 7px 4px;
    text-align: center;
  }
  .mc-grid .k { display: block; font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
  .mc-grid .v {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    white-space: nowrap;
  }
  .mc-grid .hl { background: color-mix(in srgb, var(--accent) 15%, var(--surface-2)); }
  .mc-grid .hl .v { color: var(--accent-strong); }

  /* form rows */
  .field { margin-top: 14px; }
  .field:first-child { margin-top: 0; }
  .field label {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .lbl-hint {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-strong);
  }
  .field-hint {
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-muted);
    margin: 6px 2px 0;
  }
  .num-input-wrap {
    display: flex;
    align-items: stretch;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .num-input-wrap input[type="number"] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 10px 8px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .num-input-wrap input[type="number"]::-webkit-outer-spin-button,
  .num-input-wrap input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .stepper {
    width: 46px;
    flex: none;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
  }
  .stepper:active { background: var(--surface-3); }
  .num-input-wrap .unit-suffix {
    display: flex; align-items: center;
    padding-right: 12px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 700;
  }
  input[type="text"], input[type="datetime-local"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    padding: 14px;
    margin-top: 16px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn-primary:active { transform: scale(0.98); background: var(--accent-strong); }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 14px;
    cursor: pointer;
  }
  .btn-secondary:active { background: var(--surface-3); }
  .btn-danger-text {
    background: none; border: none;
    color: var(--danger);
    font-size: 13px; font-weight: 700;
    cursor: pointer; padding: 4px 6px;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* history */
  .filter-row { display: flex; gap: 8px; }
  .filter-row select, .filter-row input[type="month"] {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13.5px;
    padding: 9px 10px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .summary-grid > div {
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
  }
  .summary-grid .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .summary-grid .l { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
  .summary-grid .hl {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .summary-grid .hl .n { color: var(--accent-strong); }
  .summary-grid .hl .l { color: var(--accent-strong); opacity: 0.8; }

  .table-scroll { overflow-x: auto; margin: 0 -4px; }
  table.agg-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  table.agg-table th, table.agg-table td {
    padding: 8px 6px;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  table.agg-table thead th {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    border-bottom: 1.5px solid var(--border);
  }
  table.agg-table tbody th[scope="row"] {
    text-align: left;
    font-weight: 700;
    padding-left: 4px;
  }
  table.agg-table thead th:first-child { text-align: left; padding-left: 4px; }
  table.agg-table td { font-variant-numeric: tabular-nums; }
  table.agg-table td.rate { font-weight: 700; color: var(--accent-strong); }
  table.agg-table tbody tr:last-child th, table.agg-table tbody tr:last-child td { border-bottom: none; }
  .tm-name { display: block; font-size: 12.5px; }
  .tm-sub { display: block; font-size: 10.5px; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
  .tm-bar {
    display: block;
    height: 5px;
    border-radius: 3px;
    background: var(--surface-3);
    margin-top: 5px;
    overflow: hidden;
    min-width: 90px;
  }
  .tm-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  svg.trend {
    display: block;
    width: 100%;
    height: auto;
    margin: 2px 0 4px;
    overflow: visible;
  }
  svg.trend .gl { stroke: var(--border); stroke-width: 1; }
  svg.trend .ln {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  svg.trend .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
  svg.trend .ax {
    fill: var(--text-muted);
    font-size: 9px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  svg.trend .vl {
    fill: var(--accent-strong);
    font-size: 9.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .log-group { margin-top: 14px; }
  .log-date {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    margin: 0 0 6px 2px;
  }
  .log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 10px;
    margin-bottom: 6px;
  }
  .log-item .time {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    width: 40px;
    flex: none;
  }
  .log-item .meta { flex: 1; min-width: 0; }
  .log-item .meta .m-name { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-item .meta .m-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .log-item .amount { text-align: right; flex: none; }
  .log-item .amount .l { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log-item .amount .c { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .log-item .del {
    flex: none;
    background: none; border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 2px 4px 6px;
  }

  /* settings */
  .list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 2px;
    border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .li-name { font-size: 14px; font-weight: 600; }
  .list-row .li-sub { font-size: 12px; color: var(--text-muted); }
  .add-inline { display: flex; gap: 8px; margin-top: 10px; }
  .add-inline input { flex: 1; }
  .add-inline .btn-secondary { flex: none; }

  /* tabs */
  nav.tabbar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 480px;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 10px;
  }
  .tab-btn svg { width: 21px; height: 21px; }
  .tab-btn.active { color: var(--accent); }

  .qr-sheet {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(10, 16, 15, 0.62);
  }
  .qr-sheet.show { display: flex; }
  .qr-panel {
    background: var(--surface);
    border-radius: 16px;
    padding: 18px 16px 16px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    text-align: center;
  }
  .qr-head { font-size: 13.5px; font-weight: 700; margin: 0 0 12px; line-height: 1.5; }
  .qr-wrap {
    background: #fff;
    border-radius: 10px;
    padding: 10px;
    margin: 0 auto 12px;
    max-width: 260px;
  }
  svg.qr { display: block; width: 100%; height: auto; }
  .qr-sub { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; margin: 0 0 14px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translateX(-50%) translateY(8px);
    background: var(--text);
    color: var(--bg);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 50;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .share-url {
    display: block;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    word-break: break-all;
    color: var(--text-muted);
    margin-top: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark"></span><h1>ゾール回収量記録</h1>
      <button class="sync-pill off" id="syncPill" type="button">未接続</button>
    </div>
    <div class="factory-switch">
      <select class="factory-select" id="factorySelect"></select>
    </div>
  </header>

  <main id="main"></main>

  <div class="qr-sheet" id="qrSheet"></div>
  <div class="toast" id="toast"></div>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="record">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      記録
    </button>
    <button class="tab-btn" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13a9 9 0 1 0 2-6.36L3 8"/><path d="M12 7v5l4 2"/></svg>
      履歴

        var fb = formatBits(mk);
        function put(row, col, v) { g2[row][col] = v; }
        for (i = 0; i <= 5; i++) put(i, 8, (fb >> i) & 1);
        put(7, 8, (fb >> 6) & 1);
        put(8, 8, (fb >> 7) & 1);
        put(8, 7, (fb >> 8) & 1);
        for (i = 9; i < 15; i++) put(8, 14 - i, (fb >> i) & 1);
        for (i = 0; i < 8; i++) put(8, size - 1 - i, (fb >> i) & 1);
        for (i = 8; i < 15; i++) put(size - 15 + i, 8, (fb >> i) & 1);
        put(size - 8, 8, 1);
        if (ver >= 7) {
          var vb = versionInfoBits(ver);
          for (i = 0; i < 18; i++) {
            var bit = (vb >> i) & 1;
            put(Math.floor(i / 3), size - 11 + i % 3, bit);
            put(size - 11 + i % 3, Math.floor(i / 3), bit);
          }
        }
        var sc = penalty(g2);
        if (sc < bestScore) { bestScore = sc; best = g2; bestMask = mk; }
      }
      return { size: size, version: ver, mask: bestMask, modules: best };
    }

    function toSvg(text, opts) {
      opts = opts || {};
      var q = opts.quiet == null ? 4 : opts.quiet;
      var qr = make(text);
      if (!qr) return null;
      var n = qr.size, total = n + q * 2, d = "";
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
        if (qr.modules[r][c]) d += "M" + (c + q) + " " + (r + q) + "h1v1h-1z";
      }
      return '<svg class="qr" viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges" ' +
        'xmlns="http://www.w3.org/2000/svg" role="img" aria-label="設定用QRコード">' +
        '<rect width="' + total + '" height="' + total + '" fill="#ffffff"/>' +
        '<path d="' + d + '" fill="#000000"/></svg>';
    }

    return { make: make, toSvg: toSvg };
  })();

  // ================= SHEETS SYNC =================
  // Talks to a Google Apps Script web app. POSTs use text/plain so the browser
  // treats them as simple requests — Apps Script cannot answer CORS preflight.
  function syncConfigured() { return !!(syncCfg.url && /^https:\/\//.test(syncCfg.url)); }

  function unsyncedRecords() {
    return state.records.filter(function (r) { return !r.synced; });
  }

  function callSheet(payload) {
    return fetch(syncCfg.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || data.ok !== true) throw new Error((data && data.error) || "サーバーエラー");
      return data;
    });
  }

  function setSyncStatus(message, error, busy) {
    syncStatus = { busy: !!busy, message: message, error: !!error };
    renderSyncPill();
  }

  function renderSyncPill() {
    var el = document.getElementById("syncPill");
    if (!el) return;
    if (!syncConfigured()) {
      el.className = "sync-pill off";
      el.textContent = "スプレッドシート未接続";
      return;
    }
    var pending = unsyncedRecords().length;
    if (syncStatus.busy) {
      el.className = "sync-pill busy";
      el.textContent = "同期中…";
    } else if (syncStatus.error) {
      el.className = "sync-pill err";
      el.textContent = "同期エラー" + (pending ? " ・未送信" + pending + "件" : "");
    } else if (pending) {
      el.className = "sync-pill warn";
      el.textContent = "未送信 " + pending + " 件";
    } else {
      el.className = "sync-pill ok";
      el.textContent = "同期済み";
    }
  }

  // Pushes anything not yet on the sheet, then pulls everything back so this
  // phone also sees what other phones recorded.
  function runSync(opts) {
    opts = opts || {};
    if (!syncConfigured()) {
      if (opts.loud) toast("先に設定タブで同期URLを登録してください");
      return Promise.resolve(false);
    }
    if (syncStatus.busy) return Promise.resolve(false);
    setSyncStatus("", false, true);

    var toPush = unsyncedRecords();
    var pushPromise = toPush.length
      ? callSheet({ action: "push", token: syncCfg.token, device: syncCfg.device, records: toPush })
      : Promise.resolve({ ok: true });

    return pushPromise.then(function () {
      toPush.forEach(function (r) { r.synced = true; });
      return callSheet({ action: "pull", token: syncCfg.token });
    }).then(function (data) {
      var incoming = data.records || [];
      var known = {};
      state.records.forEach(function (r) { known[r.id] = r; });
      var added = 0;
      incoming.forEach(function (r) {
        if (!r || !r.id || known[r.id]) return;
        if (r.factory && state.factories.indexOf(r.factory) === -1) state.factories.push(r.factory);
        var machine = state.machines.find(function (m) {
          return m.factory === r.factory && m.name === r.machineName && m.number === String(r.machineNumber);
        });
        if (!machine) {
          machine = { id: uid(), factory: r.factory, name: r.machineName, number: String(r.machineNumber) };
          state.machines.push(machine);
        }
        state.records.push({
          id: r.id,
          ts: r.ts,
          factory: r.factory,
          machineId: machine.id,
          machineName: r.machineName,
          machineNumber: String(r.machineNumber),
          addedL: Number(r.addedL) || 0,
          literL: Number(r.literL) || 0,
          count: parseInt(r.count, 10) || 0,
          recorder: r.recorder || "",
          synced: true
        });
        added++;
      });
      syncCfg.lastSync = new Date().toISOString();
      saveSyncCfg();
      saveState();
      setSyncStatus("", false, false);
      renderFactorySelect();
      if (opts.loud) {
        toast("同期しました" + (toPush.length ? " ・送信" + toPush.length + "件" : "") + (added ? " ・受信" + added + "件" : ""));
      }
      if (opts.rerender !== false && (added || toPush.length)) renderMain();
      return true;
    }).catch(function (err) {
      saveState();
      setSyncStatus(String(err && err.message || err), true, false);
      if (opts.loud) toast("同期できませんでした: " + (err && err.message || err));
      return false;
    });
  }

  // ---------- factory select (header) ----------
  function renderFactorySelect() {
    var sel = document.getElementById("factorySelect");
    sel.innerHTML = state.factories.map(function (f) {
      return '<option value="' + escapeHtml(f) + '"' + (f === state.ui.factory ? " selected" : "") + ">" + escapeHtml(f) + "</option>";
    }).join("");
    sel.onchange = function () {
      state.ui.factory = sel.value;
      state.ui.machineId = null;
      saveState();
      renderMain();
    };
  }

  // ================= RECORD TAB =================
  function renderRecordTab() {
    var factory = state.ui.factory;
    var mList = machinesFor(factory);
    if (!mList.some(function (m) { return m.id === state.ui.machineId; })) {
      state.ui.machineId = mList.length ? mList[0].id : null;
    }

    var facRecs = recordsFor(factory);
    var lastRec = null;
    var cumA = 0, cumL = 0, cumC = 0;
    facRecs.forEach(function (r) {
      // 日時は分単位なので同着になりうる。同着なら後から入力した方を「直前」とする。
      if (!lastRec || r.ts.localeCompare(lastRec.ts) >= 0) lastRec = r;
      cumA += r.addedL || 0;
      cumL += r.literL;
      cumC += r.count;
    });

    var html = "";
    html += '<div class="stats-row">';
    html += '  <div class="stat"><div class="label">累計 追加量</div><div class="value">' + fmtNum(cumA) + '<span class="unit">L</span></div></div>';
    html += '  <div class="stat"><div class="label">累計 回収量</div><div class="value">' + fmtNum(cumL) + '<span class="unit">L</span></div></div>';
    html += '  <div class="stat"><div class="label">累計 回転数</div><div class="value">' + cumC + '<span class="unit">回</span></div></div>';
    html += '  <div class="stat accent"><div class="label">回収率</div><div class="value">' + rateText(cumL, cumA) + '</div></div>';
    html += '</div>';
    html += '<p class="scope-note">' + escapeHtml(factory) + ' の全期間累計 ・ 回収率 = 回収量累計 ÷ 追加量累計';
    if (lastRec) {
      html += '<br>直前の記録: ' + escapeHtml(lastRec.machineName) + ' No.' + escapeHtml(lastRec.machineNumber) +
        ' ・ 追加 ' + fmtNum(lastRec.addedL || 0) + 'L / 回収 ' + fmtNum(lastRec.literL) + 'L / ' + lastRec.count + '回';
    }
    html += '</p>';

    html += '<div class="card">';
    html += '  <p class="section-label">機械を選択</p>';
    if (mList.length) {
      html += '  <div class="machine-grid" id="machineGrid">';
      mList.forEach(function (m) {
        html += '<button type="button" class="machine-btn' + (m.id === state.ui.machineId ? " active" : "") + '" data-id="' + m.id + '">' +
          '<div class="name">' + escapeHtml(m.name) + '</div><div class="num">No. ' + escapeHtml(m.number) + '</div></button>';
      });
      html += '  </div>';
    } else {
      html += '  <p class="empty-note">この工場にはまだ機械が登録されていません。「設定」タブから追加してください。</p>';
    }

    // ゾールはドライ機側に追加するため、追加量は機械に紐づかない。
    // 機械別の回収率は工場全体の追加量累計を分母にする。
    var selected = findMachine(state.ui.machineId);
    if (selected) {
      var mL = 0, mC = 0, mN = 0;
      facRecs.forEach(function (r) {
        if (r.machineName !== selected.name || r.machineNumber !== selected.number) return;
        mL += r.literL;
        mC += r.count;
        mN++;
      });
      html += '  <div class="machine-cum">';
      html += '    <p class="mc-title">' + escapeHtml(selected.name) + ' No.' + escapeHtml(selected.number) + ' の累計';
      html += '      <span class="mc-n">' + mN + ' 件</span></p>';
      html += '    <div class="mc-grid mc-grid-3">';
      html += '      <div><span class="k">回収量</span><span class="v">' + fmtNum(mL) + ' L</span></div>';
      html += '      <div><span class="k">回転数</span><span class="v">' + mC + ' 回</span></div>';
      html += '      <div class="hl"><span class="k">回収率</span><span class="v">' + ratePlain(mL, cumA) + '</span></div>';
      html += '    </div>';
      html += '    <p class="mc-note">回収率 = この機械の回収量 ÷ ' + escapeHtml(factory) + ' の追加量累計 ' + fmtNum(cumA) + ' L</p>';
      html += '  </div>';
    }
    html += '</div>';

    html += '<div class="card">';
    html += '  <div class="field"><label for="addedInput">追加量 (L)<span class="lbl-hint">ドライ機へ追加した分</span></label>';
    html += '    <div class="num-input-wrap"><button type="button" class="stepper" data-added="-0.5">−</button>';
    html += '      <input type="number" id="addedInput" inputmode="decimal" step="0.1" min="0" placeholder="0.0">';
    html += '      <button type="button" class="stepper" data-added="0.5">＋</button></div>';
    html += '    <p class="field-hint">機械別には分けず、' + escapeHtml(factory) + ' の累計に加算されます。追加がなければ空欄のままで構いません。</p></div>';

    html += '  <div class="field"><label for="literInput">回収量 (L)</label>';
    html += '    <div class="num-input-wrap"><button type="button" class="stepper" data-step="-0.5">−</button>';
    html += '      <input type="number" id="literInput" inputmode="decimal" step="0.1" min="0" placeholder="0.0">';
    html += '      <button type="button" class="stepper" data-step="0.5">＋</button></div></div>';

    html += '  <div class="field"><label for="countInput">回転数</label>';
    html += '    <div class="num-input-wrap"><button type="button" class="stepper" data-count="-1">−</button>';
    html += '      <input type="number" id="countInput" inputmode="numeric" min="0" value="' + pendingCount + '">';
    html += '      <button type="button" class="stepper" data-count="1">＋</button></div></div>';

    html += '  <div class="field"><label for="tsInput">日時</label>';
    html += '    <input type="datetime-local" id="tsInput" value="' + nowLocalInputValue() + '"></div>';

    html += '  <div class="field"><label for="recorderInput">記録者(任意)</label>';
    html += '    <input type="text" id="recorderInput" placeholder="氏名" value="' + escapeHtml(state.ui.recorder || "") + '"></div>';

    html += '  <button class="btn-primary" id="submitBtn" type="button" ' + (mList.length ? "" : "disabled") + '>記録する</button>';
    html += '</div>';

    document.getElementById("main").innerHTML = html;

    document.querySelectorAll("#machineGrid .machine-btn").forEach(function (btn) {
      btn.onclick = function () {
        state.ui.machineId = btn.getAttribute("data-id");
        saveState();
        renderRecordTab();
      };
    });

    var literInput = document.getElementById("literInput");
    var addedInput = document.getElementById("addedInput");
    function bindStepper(attr, input) {
      document.querySelectorAll(".stepper[" + attr + "]").forEach(function (btn) {
        btn.onclick = function () {
          var step = parseFloat(btn.getAttribute(attr));
          var cur = parseFloat(input.value) || 0;
          var next = Math.max(0, Math.round((cur + step) * 10) / 10);
          input.value = next === 0 ? "" : next;
        };
      });
    }
    bindStepper("data-step", literInput);
    bindStepper("data-added", addedInput);
    var countInput = document.getElementById("countInput");
    document.querySelectorAll(".stepper[data-count]").forEach(function (btn) {
      btn.onclick = function () {
        var step = parseInt(btn.getAttribute("data-count"), 10);
        var cur = parseInt(countInput.value, 10) || 0;
        countInput.value = Math.max(0, cur + step);
      };
    });

    document.getElementById("submitBtn").onclick = function () {
      var m = findMachine(state.ui.machineId);
      if (!m) { toast("機械を選択してください"); return; }
      var literVal = parseFloat(literInput.value);
      var addedVal = parseFloat(addedInput.value);
      var countVal = parseInt(countInput.value, 10);
      var tsVal = document.getElementById("tsInput").value;
      var recorder = document.getElementById("recorderInput").value.trim();
      if (isNaN(literVal) && isNaN(addedVal) && isNaN(countVal)) {
        toast("追加量・回収量・回転数のどれかを入力してください"); return;
      }
      if (!tsVal) { toast("日時を入力してください"); return; }

      state.records.push({
        id: uid(),
        ts: new Date(tsVal).toISOString(),
        factory: factory,
        machineId: m.id,
        machineName: m.name,
        machineNumber: m.number,
        addedL: isNaN(addedVal) ? 0 : addedVal,
        literL: isNaN(literVal) ? 0 : literVal,
        count: isNaN(countVal) ? 0 : countVal,
        recorder: recorder,
        synced: false
      });
      state.ui.recorder = recorder;
      pendingCount = isNaN(countVal) ? 1 : countVal;
      saveState();
      toast("記録しました");
      renderMain();
      // Saved locally first, so a dead signal never loses the entry.
      if (syncConfigured()) runSync({ rerender: false });
    };
  }

  // ================= HISTORY TAB =================
  var historyFilter = { factory: "__all__", month: "" };

  function renderHistoryTab() {
    var all = state.records.slice().sort(function (a, b) { return b.ts.localeCompare(a.ts); });
    var filtered = all.filter(function (r) {
      if (historyFilter.factory !== "__all__" && r.factory !== historyFilter.factory) return false;
      if (historyFilter.month && monthKey(r.ts) !== historyFilter.month) return false;
      return true;
    });

    var totalL = filtered.reduce(function (a, r) { return a + r.literL; }, 0);
    var totalA = filtered.reduce(function (a, r) { return a + (r.addedL || 0); }, 0);
    var totalC = filtered.reduce(function (a, r) { return a + r.count; }, 0);

    var html = '<div class="card">';
    html += '  <p class="section-label">絞り込み</p>';
    html += '  <div class="filter-row">';
    html += '    <select id="filterFactory"><option value="__all__">すべての工場</option>' +
      state.factories.map(function (f) { return '<option value="' + escapeHtml(f) + '"' + (f === historyFilter.factory ? " selected" : "") + ">" + escapeHtml(f) + "</option>"; }).join("") +
      '</select>';
    html += '    <input type="month" id="filterMonth" value="' + historyFilter.month + '">';
    html += '  </div>';
    html += '  <div class="summary-grid">';
    html += '    <div><div class="n">' + fmtNum(totalA) + ' L</div><div class="l">合計追加量</div></div>';
    html += '    <div><div class="n">' + fmtNum(totalL) + ' L</div><div class="l">合計回収量</div></div>';
    html += '    <div><div class="n">' + totalC + ' 回</div><div class="l">合計回転数</div></div>';
    html += '    <div class="hl"><div class="n">' + ratePlain(totalL, totalA) + '</div><div class="l">回収率</div></div>';
    html += '  </div>';
    html += '  <p class="empty-note" style="margin-top:8px;">記録件数 ' + filtered.length + ' 件 ・ 回収率 = 回収量累計 ÷ 追加量累計</p>';
    html += '</div>';

    // 推移は月フィルタを無視する。1か月だけ切り出すと折れ線にならないため。
    var trendSource = all.filter(function (r) {
      return historyFilter.factory === "__all__" || r.factory === historyFilter.factory;
    });
    if (trendSource.length) {
      html += '<div class="card" style="margin-top:12px;">';
      html += '  <p class="section-label">回収率の推移(月別・全期間)</p>';
      html += trendChartSvg(trendSource);
      html += '  <p class="empty-note">縦軸は回収率(%)。各月の 回収量 ÷ 追加量 です。</p>';
      html += '</div>';
    }

    // 機械別に見ると、どの機械の回収率が落ちているかが分かる。
    if (filtered.length) {
      var byMachine = {};
      var mOrder = [];
      filtered.forEach(function (r) {
        var k = r.factory + "|" + r.machineName + "|" + r.machineNumber;
        if (!byMachine[k]) {
          byMachine[k] = { name: r.machineName, number: r.machineNumber, factory: r.factory, rec: 0, cnt: 0, n: 0 };
          mOrder.push(k);
        }
        var g = byMachine[k];
        g.rec += r.literL;
        g.cnt += r.count;
        g.n++;
      });
      mOrder.sort(function (a, b) { return byMachine[b].rec - byMachine[a].rec; });
      // 棒の長さは機械どうしの比較用なので、最大値を100%として揃える。
      var maxRec = Math.max.apply(null, mOrder.map(function (k) { return byMachine[k].rec; }));

      html += '<div class="card" style="margin-top:12px;">';
      html += '  <p class="section-label">機械別の集計</p>';
      html += '  <div class="table-scroll"><table class="agg-table">';
      html += '    <thead><tr><th>機械</th><th>回収量</th><th>回転数</th><th>回収率</th></tr></thead><tbody>';
      mOrder.forEach(function (k) {
        var g = byMachine[k];
        var pct = maxRec > 0 ? (g.rec / maxRec) * 100 : 0;
        html += '<tr><th scope="row"><span class="tm-name">' + escapeHtml(g.name) + '</span><span class="tm-sub">No.' + escapeHtml(g.number) + ' ・ ' + escapeHtml(g.factory) + '</span>';
        html += '<span class="tm-bar"><span style="width:' + pct.toFixed(1) + '%"></span></span></th>';
        html += '<td>' + fmtNum(g.rec) + '</td><td>' + g.cnt + '</td>';
        html += '<td class="rate">' + ratePlain(g.rec, totalA) + '</td></tr>';
      });
      html += '    </tbody></table></div>';
      html += '  <p class="empty-note" style="margin-top:8px;">回収率 = 各機械の回収量 ÷ 追加量累計 ' + fmtNum(totalA) + ' L(ゾールはドライ機に追加するため、追加量は機械別に分けていません)</p>';
      html += '</div>';
    }

    if (!filtered.length) {
      html += '<p class="empty-note" style="margin-top:14px;">条件に一致する記録がありません。</p>';
    } else {
      var groups = {};
      var order = [];
      filtered.forEach(function (r) {
        var k = dayKey(r.ts);
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(r);
      });
      order.forEach(function (k) {
        html += '<div class="log-group"><p class="log-date">' + fmtDay(groups[k][0].ts) + '</p>';
        groups[k].forEach(function (r) {
          html += '<div class="log-item">';
          html += '  <div class="time">' + fmtTime(r.ts) + '</div>';
          html += '  <div class="meta"><div class="m-name">' + escapeHtml(r.machineName) + ' No.' + escapeHtml(r.machineNumber) + '</div>';
          html += '    <div class="m-sub">' + escapeHtml(r.factory) + (r.recorder ? " ・ " + escapeHtml(r.recorder) : "") + '</div></div>';
          html += '  <div class="amount"><div class="l">追加 ' + fmtNum(r.addedL || 0) + ' / 回収 ' + fmtNum(r.literL) + ' L</div>';
          html += '    <div class="c">' + r.count + ' 回</div></div>';
          html += '  <button class="del" data-id="' + r.id + '" title="削除">✕</button>';
          html += '</div>';
        });
        html += '</div>';
      });
    }

    html += '<div class="card" style="margin-top:14px;">';
    html += '  <p class="section-label">データ共有</p>';
    html += '  <div class="btn-row">';
    html += '    <button class="btn-secondary" id="exportCsvBtn" type="button">CSVをエクスポート</button>';
    html += '    <button class="btn-secondary" id="importCsvBtn" type="button">CSVを取り込む</button>';
    html += '  </div>';
    html += '  <input type="file" id="csvFile" accept=".csv,text/csv" class="hidden">';
    html += '  <p class="empty-note" style="margin-top:8px;">他のスマホでエクスポートしたCSVをこの端末に取り込んで合算できます。</p>';
    html += '</div>';

    document.getElementById("main").innerHTML = html;

    document.getElementById("filterFactory").onchange = function (e) { historyFilter.factory = e.target.value; renderHistoryTab(); };
    document.getElementById("filterMonth").onchange = function (e) { historyFilter.month = e.target.value; renderHistoryTab(); };
    document.querySelectorAll(".log-item .del").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-id");
        if (!confirm("この記録を削除しますか?")) return;
        var wasSynced = state.records.some(function (r) { return r.id === id && r.synced; });
        state.records = state.records.filter(function (r) { return r.id !== id; });
        saveState();
        renderHistoryTab();
        // Remove it from the sheet too, or the next pull would bring it back.
        if (wasSynced && syncConfigured()) {
          callSheet({ action: "delete", token: syncCfg.token, id: id }).then(function () {
            toast("スプレッドシートからも削除しました");
          }).catch(function (err) {
            toast("シート側の削除に失敗しました: " + (err && err.message || err));
          });
        }
      };
    });
    document.getElementById("exportCsvBtn").onclick = function () { exportCsv(filtered); };
    document.getElementById("importCsvBtn").onclick = function () { document.getElementById("csvFile").click(); };
    document.getElementById("csvFile").onchange = function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { importCsv(reader.result); e.target.value = ""; };
      reader.readAsText(file, "utf-8");
    };
  }

  function csvField(v) {
    v = String(v == null ? "" : v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  function exportCsv(records) {
    var header = ["日時", "工場", "機械名", "機械番号", "追加量L", "回収量L", "回転数", "回収率%", "記録者"];
    var lines = [header.join(",")];
    records.slice().sort(function (a, b) { return a.ts.localeCompare(b.ts); }).forEach(function (r) {
      var pct = rate(r.literL, r.addedL || 0);
      lines.push([
        r.ts, r.factory, r.machineName, r.machineNumber,
        r.addedL || 0, r.literL, r.count,
        pct === null ? "" : Math.round(pct * 10) / 10,
        r.recorder || ""
      ].map(csvField).join(","));
    });
    var csv = "﻿" + lines.join("\r\n");
    var fname = "zol_" + todayKey() + ".csv";
    saveFile(fname, csv, "csv");
  }

  function saveFile(filename, content, ext) {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: filename, data: content }).then(function () {
        toast("保存しました: " + filename);
      }).catch(function (err) {
        if (err && err.code === "extension_not_enabled" && ext !== "txt") {
          var altName = filename.replace(/\.[a-z0-9]+$/i, "") + ".txt";
          saveFile(altName, content, "txt");
        } else if (err && err.code === "declined") {
          // user declined; no message needed
        } else {
          toast("保存できませんでした");
        }
      });
    } else {
      toast("この環境ではファイル保存が利用できません");
    }
  }

  function parseCsvLine(line) {
    var out = []; var cur = ""; var inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (inQ) {
        if (c === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; } else { inQ = false; }
        } else cur += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',') { out.push(cur); cur = ""; }
        else cur += c;
      }
    }
    out.push(cur);
    return out;
  }

  function importCsv(text) {
    text = text.replace(/^﻿/, "");
    var lines = text.split(/\r\n|\n|\r/).filter(function (l) { return l.trim().length; });
    if (lines.length < 2) { toast("読み込めるデータがありません"); return; }
    var rows = lines.slice(1).map(parseCsvLine);
    var added = 0;
    rows.forEach(function (cols) {
      if (cols.length < 7) return;
      var ts = cols[0], factory = cols[1], mName = cols[2], mNum = cols[3];
      var addedL = parseFloat(cols[4]) || 0;
      var literL = parseFloat(cols[5]) || 0;
      var count = parseInt(cols[6], 10) || 0;
      var recorder = cols[8] || "";
      var tsIso;
      var d = new Date(ts);
      tsIso = isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();

      if (factory && state.factories.indexOf(factory) === -1) state.factories.push(factory);
      var machine = state.machines.find(function (m) { return m.factory === factory && m.name === mName && m.number === mNum; });
      if (!machine) {
        machine = { id: uid(), factory: factory, name: mName, number: mNum };
        state.machines.push(machine);
      }
      var dup = state.records.some(function (r) {
        return r.ts === tsIso && r.factory === factory && r.machineId === machine.id &&
          r.literL === literL && (r.addedL || 0) === addedL && r.count === count;
      });
      if (dup) return;
      state.records.push({
        id: uid(), ts: tsIso, factory: factory, machineId: machine.id,
        machineName: mName, machineNumber: mNum,
        addedL: addedL, literL: literL, count: count,
        recorder: recorder, synced: false
      });
      added++;
    });
    saveState();
    toast(added + "件を取り込みました");
    renderFactorySelect();
    renderHistoryTab();
  }

  // ================= SETTINGS TAB =================
  function renderSettingsTab() {
    var factory = state.ui.factory;
    var html = "";

    html += '<div class="card">';
    html += '  <p class="section-label">工場を管理</p>';
    state.factories.forEach(function (f) {
      html += '<div class="list-row"><span class="li-name">' + escapeHtml(f) + '</span>';
      html += (state.factories.length > 1 ? '<button class="btn-danger-text" data-del-factory="' + escapeHtml(f) + '">削除</button>' : '') + '</div>';
    });
    html += '  <div class="add-inline"><input type="text" id="newFactory" placeholder="新しい工場名"><button class="btn-secondary" id="addFactoryBtn" type="button">追加</button></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '  <p class="section-label">機械を管理(' + escapeHtml(factory) + ')</p>';
    var mList = machinesFor(factory);
    if (mList.length) {
      mList.forEach(function (m) {
        html += '<div class="list-row"><span><span class="li-name">' + escapeHtml(m.name) + '</span> <span class="li-sub">No.' + escapeHtml(m.number) + '</span></span>';
        html += '<button class="btn-danger-text" data-del-machine="' + m.id + '">削除</button></div>';
      });
    } else {
      html += '<p class="empty-note">機械が登録されていません。</p>';
    }
    html += '  <div class="add-inline"><input type="text" id="newMachineName" placeholder="機械名 例) TOSEI HRD-301S" style="flex:2;">';
    html += '    <input type="text" id="newMachineNum" placeholder="番号" style="flex:1;"></div>';
    html += '  <button class="btn-secondary" id="addMachineBtn" type="button" style="margin-top:8px; width:100%;">機械を追加</button>';
    html += '</div>';

    html += '<div class="card">';
    html += '  <p class="section-label">スプレッドシート同期</p>';
    html += '  <div class="field"><label for="syncUrlInput">同期URL (Apps Script ウェブアプリ)</label>';
    html += '    <input type="text" id="syncUrlInput" placeholder="https://script.google.com/macros/s/..." value="' + escapeHtml(syncCfg.url) + '"></div>';
    html += '  <div class="field"><label for="syncTokenInput">合言葉</label>';
    html += '    <input type="text" id="syncTokenInput" placeholder="Apps Script に設定した合言葉" value="' + escapeHtml(syncCfg.token) + '"></div>';
    html += '  <div class="btn-row" style="margin-top:12px;">';
    html += '    <button class="btn-secondary" id="saveSyncBtn" type="button">保存して接続テスト</button>';
    html += '    <button class="btn-secondary" id="syncNowBtn" type="button">今すぐ同期</button>';
    html += '  </div>';
    var pend = unsyncedRecords().length;
    html += '  <p class="empty-note" style="margin-top:10px;">' +
      (syncCfg.lastSync ? "最終同期: " + new Date(syncCfg.lastSync).toLocaleString("ja-JP") : "まだ同期していません") +
      (pend ? " ・未送信 " + pend + " 件" : "") + '</p>';
    if (syncStatus.error && syncStatus.message) {
      html += '  <p class="empty-note" style="color:var(--danger);">エラー: ' + escapeHtml(syncStatus.message) + '</p>';
    }
    if (syncConfigured()) {
      html += '  <p class="section-label" style="margin-top:16px;">この設定を他のスマホへ</p>';
      html += '  <span class="share-url" id="setupUrl"></span>';
      html += '  <div class="btn-row" style="margin-top:8px;">';
      html += '    <button class="btn-secondary" id="showQrBtn" type="button">QRコードを表示</button>';
      html += '    <button class="btn-secondary" id="copySetupBtn" type="button">設定リンクをコピー</button>';
      html += '  </div>';
      html += '  <p class="empty-note" style="margin-top:6px;">QRコードを作業者のスマホで読み取れば、同期設定まで自動で入ります。合言葉が入るため、社外の人が見る場所には貼らないでください。</p>';
    }
    html += '</div>';

    html += '<div class="card">';
    html += '  <p class="section-label">共有</p>';
    html += '  <p class="empty-note">下のURLを他のスマホで開くと同じ記録アプリが使えます(データは端末ごとに保存され、履歴タブのCSV機能で合算できます)。QRコードは印刷用に別途お渡しします。</p>';
    html += '  <span class="share-url" id="shareUrl"></span>';
    html += '  <div class="btn-row" style="margin-top:8px;"><button class="btn-secondary" id="copyUrlBtn" type="button">URLをコピー</button></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '  <p class="section-label">データのバックアップ</p>';
    html += '  <div class="btn-row">';
    html += '    <button class="btn-secondary" id="exportJsonBtn" type="button">全データをバックアップ</button>';
    if (isParent()) {
      html += '    <button class="btn-secondary" id="importJsonBtn" type="button">バックアップを復元</button>';
    }
    html += '  </div>';
    html += '  <input type="file" id="jsonFile" accept=".json,application/json" class="hidden">';
    if (isParent()) {
      html += '  <div class="btn-row" style="margin-top:10px;"><button class="btn-danger-text" id="clearAllBtn" type="button">全データを削除</button></div>';
    } else {
      html += '  <p class="empty-note" style="margin-top:10px;">全データの削除と復元は親機のみ行えます。</p>';
    }
    html += '</div>';

    html += '<div class="card">';
    html += '  <p class="section-label">この端末</p>';
    html += '  <div class="list-row"><span><span class="li-name">' + (isParent() ? '親機(管理者)' : '子機') + '</span>';
    html += '    <span class="li-sub">' + escapeHtml(syncCfg.device) + '</span></span>';
    html += '    <button class="btn-secondary" id="roleBtn" type="button">' + (isParent() ? '子機にする' : '親機にする') + '</button></div>';
    html += '  <p class="empty-note" style="margin-top:8px;">' +
      (isParent()
        ? '親機は全データの削除と復元ができます。現場で使うスマホは子機にしてください。'
        : '子機は記録と同期ができます。親機にするには合言葉の入力が必要です。') + '</p>';
    html += '</div>';

    document.getElementById("main").innerHTML = html;
    document.getElementById("shareUrl").textContent = location.origin + location.pathname;

    function setupLink() {
      var base = location.origin + location.pathname;
      return base + "?sync=" + encodeURIComponent(syncCfg.url) + (syncCfg.token ? "&key=" + encodeURIComponent(syncCfg.token) : "");
    }
    var setupUrlEl = document.getElementById("setupUrl");
    if (setupUrlEl) setupUrlEl.textContent = setupLink();
    var showQrBtn = document.getElementById("showQrBtn");
    if (showQrBtn) showQrBtn.onclick = function () { openQrSheet(setupLink()); };

    var copySetupBtn = document.getElementById("copySetupBtn");
    if (copySetupBtn) copySetupBtn.onclick = function () {
      navigator.clipboard && navigator.clipboard.writeText(setupLink()).then(function () {
        toast("設定リンクをコピーしました");
      }).catch(function () { toast("コピーできませんでした"); });
    };

    document.getElementById("saveSyncBtn").onclick = function () {
      syncCfg.url = document.getElementById("syncUrlInput").value.trim();
      syncCfg.token = document.getElementById("syncTokenInput").value.trim();
      saveSyncCfg();
      if (!syncConfigured()) { toast("https:// で始まるURLを入力してください"); renderSyncPill(); return; }
      runSync({ loud: true, rerender: false }).then(function () { renderSettingsTab(); });
    };
    document.getElementById("syncNowBtn").onclick = function () {
      runSync({ loud: true, rerender: false }).then(function () { renderSettingsTab(); });
    };

    document.getElementById("addFactoryBtn").onclick = function () {
      var input = document.getElementById("newFactory");
      var name = input.value.trim();
      if (!name) return;
      if (state.factories.indexOf(name) !== -1) { toast("すでに存在します"); return; }
      state.factories.push(name);
      state.ui.factory = name;
      saveState();
      renderFactorySelect();
      renderSettingsTab();
    };
    document.querySelectorAll("[data-del-factory]").forEach(function (btn) {
      btn.onclick = function () {
        var f = btn.getAttribute("data-del-factory");
        if (!confirm(f + " を削除しますか? 関連する機械と記録も削除されます。")) return;
        state.factories = state.factories.filter(function (x) { return x !== f; });
        state.machines = state.machines.filter(function (m) { return m.factory !== f; });
        state.records = state.records.filter(function (r) { return r.factory !== f; });
        if (state.ui.factory === f) state.ui.factory = state.factories[0];
        saveState();
        renderFactorySelect();
        renderSettingsTab();
      };
    });

    document.getElementById("addMachineBtn").onclick = function () {
      var name = document.getElementById("newMachineName").value.trim();
      var num = document.getElementById("newMachineNum").value.trim();
      if (!name || !num) { toast("機械名と番号を入力してください"); return; }
      state.machines.push({ id: uid(), factory: factory, name: name, number: num });
      saveState();
      renderSettingsTab();
    };
    document.querySelectorAll("[data-del-machine]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-del-machine");
        if (!confirm("この機械を削除しますか?")) return;
        state.machines = state.machines.filter(function (m) { return m.id !== id; });
        saveState();
        renderSettingsTab();
      };
    });

    document.getElementById("copyUrlBtn").onclick = function () {
      navigator.clipboard && navigator.clipboard.writeText(location.href).then(function () {
        toast("URLをコピーしました");
      }).catch(function () { toast("コピーできませんでした"); });
    };

    document.getElementById("roleBtn").onclick = function () {
      if (isParent()) {
        if (!confirm("この端末を子機にしますか?\n全データの削除と復元ができなくなります。")) return;
        syncCfg.role = "child";
      } else {
        var entered = prompt("親機にするには合言葉を入力してください。");
        if (entered === null) return;
        if (!syncCfg.token) { toast("先に同期設定を済ませてください"); return; }
        if (entered.trim() !== syncCfg.token) { toast("合言葉が違います"); return; }
        syncCfg.role = "parent";
      }
      saveSyncCfg();
      renderSettingsTab();
      toast(isParent() ? "親機にしました" : "子機にしました");
    };

    document.getElementById("exportJsonBtn").onclick = function () {
      saveFile("zol_backup_" + todayKey() + ".json", JSON.stringify(state, null, 2), "json");
    };
    var importJsonBtn = document.getElementById("importJsonBtn");
    if (importJsonBtn) importJsonBtn.onclick = function () { document.getElementById("jsonFile").click(); };
    document.getElementById("jsonFile").onchange = function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!data.factories || !data.machines || !data.records) throw new Error("invalid");
          if (!confirm("現在のデータを置き換えて復元しますか?")) return;
          state = data;
          state.ui = state.ui || { factory: state.factories[0] };
          saveState();
          renderFactorySelect();
          renderSettingsTab();
          toast("復元しました");
        } catch (err) {
          toast("バックアップファイルを読み込めませんでした");
        }
      };
      reader.readAsText(file, "utf-8");
      e.target.value = "";
    };
    var clearAllBtn = document.getElementById("clearAllBtn");
    if (clearAllBtn) clearAllBtn.onclick = function () {
      if (!isParent()) return;
      if (!confirm("この端末のすべてのデータを削除します。\n(スプレッドシートの記録は消えません)\nよろしいですか?")) return;
      var entered = prompt("確認のため合言葉を入力してください。");
      if (entered === null) return;
      if (!syncCfg.token || entered.trim() !== syncCfg.token) { toast("合言葉が違います。削除を中止しました"); return; }
      state = defaultState();
      saveState();
      renderFactorySelect();
      renderSettingsTab();
      toast("削除しました");
    };
  }

  // ================= QR OVERLAY =================
  function openQrSheet(link) {
    var svg = QR.toSvg(link);
    var el = document.getElementById("qrSheet");
    if (!svg) {
      toast("リンクが長すぎてQRコードを作れませんでした");
      return;
    }
    el.innerHTML =
      '<div class="qr-panel" role="dialog" aria-modal="true" aria-label="設定用QRコード">' +
      '  <p class="qr-head">このQRコードを作業者のスマホで読み取ってください</p>' +
      '  <div class="qr-wrap">' + svg + '</div>' +
      '  <p class="qr-sub">読み取った端末は<b>子機</b>として設定され、同期URLと合言葉が自動で入ります。</p>' +
      '  <div class="btn-row" style="justify-content:center;">' +
      '    <button class="btn-secondary" id="qrCloseBtn" type="button">閉じる</button>' +
      '  </div>' +
      '</div>';
    el.classList.add("show");
    document.getElementById("qrCloseBtn").onclick = closeQrSheet;
    el.onclick = function (e) { if (e.target === el) closeQrSheet(); };
    document.addEventListener("keydown", qrEscHandler);
    document.getElementById("qrCloseBtn").focus();
  }
  function qrEscHandler(e) { if (e.key === "Escape") closeQrSheet(); }
  function closeQrSheet() {
    var el = document.getElementById("qrSheet");
    el.classList.remove("show");
    el.innerHTML = "";
    document.removeEventListener("keydown", qrEscHandler);
  }

  // ================= TAB SWITCH =================
  function renderMain() {
    if (activeTab === "record") renderRecordTab();
    else if (activeTab === "history") renderHistoryTab();
    else renderSettingsTab();
    renderSyncPill();
  }

  document.querySelectorAll(".tab-btn").forEach(function (btn) {
    btn.onclick = function () {
      activeTab = btn.getAttribute("data-tab");
      document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.toggle("active", b === btn); });
      renderMain();
    };
  });

  document.getElementById("syncPill").onclick = function () {
    if (!syncConfigured()) {
      activeTab = "settings";
      document.querySelectorAll(".tab-btn").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-tab") === "settings");
      });
      renderMain();
      return;
    }
    runSync({ loud: true });
  };

  renderFactorySelect();
  renderMain();
  renderSyncPill();

  if (syncConfigured()) runSync({});
  window.addEventListener("online", function () { if (syncConfigured()) runSync({}); });
})();
</script>
