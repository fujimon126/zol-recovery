    var html = '<div class="qr-panel" role="dialog" aria-modal="true" aria-label="記録を修正">';
    html += '  <p class="qr-head">記録を修正</p>';
    html += '  <p class="edit-target">' + escapeHtml(rec.machineName) + ' No.' + escapeHtml(rec.machineNumber) +
      '<span>' + escapeHtml(rec.factory) + ' ・ ' + fmtDay(rec.ts) + ' ' + fmtTime(rec.ts) + '</span></p>';
    html += '  <div class="edit-form">';
    html += '    <div class="field"><label for="eAdded">追加量 (L)</label>';
    html += '      <div class="num-input-wrap"><input type="number" id="eAdded" inputmode="decimal" step="0.1" min="0" value="' + (rec.addedL || 0) + '"></div></div>';
    html += '    <div class="field"><label for="eLiter">回収量 (kg)<span class="lbl-hint">はかりの値</span></label>';
    html += '      <div class="num-input-wrap"><input type="number" id="eLiter" inputmode="decimal" step="0.1" min="0" value="' + lToKg(rec.literL) + '"></div>';
    html += '      <p class="field-hint" id="eKgHint"></p></div>';
    html += '    <div class="field"><label for="eCount">回転数</label>';
    html += '      <div class="num-input-wrap"><input type="number" id="eCount" inputmode="numeric" min="0" value="' + rec.count + '"></div></div>';
    html += '    <div class="field"><label for="eTs">日時</label>';
    html += '      <input type="datetime-local" id="eTs" value="' + isoToLocalInput(rec.ts) + '"></div>';
    html += '  </div>';
    html += '  <div class="btn-row" style="justify-content:center; margin-top:14px;">';
    html += '    <button class="btn-secondary" id="eSaveBtn" type="button">保存する</button>';
    html += '    <button class="btn-secondary" id="eCancelBtn" type="button">やめる</button>';
    html += '  </div>';
    html += '</div>';
    el.innerHTML = html;
    el.classList.add("show");
    el.onclick = function (e) { if (e.target === el) closeQrSheet(); };
    document.addEventListener("keydown", qrEscHandler);

    document.getElementById("eCancelBtn").onclick = closeQrSheet;

    var eLiter = document.getElementById("eLiter");
    var eKgHint = document.getElementById("eKgHint");
    function showEditConverted() {
      var kg = parseFloat(eLiter.value);
      eKgHint.textContent = isNaN(kg) || kg <= 0
        ? "キログラムで入力してください(比重 " + density() + " kg/L)"
        : fmtNum(kg) + " kg → " + fmtNum(kgToL(kg)) + " L として記録します";
    }
    eLiter.oninput = showEditConverted;
    showEditConverted();

    document.getElementById("eSaveBtn").onclick = function () {
      var a = parseFloat(document.getElementById("eAdded").value);
      var kg = parseFloat(eLiter.value);
      var l = isNaN(kg) ? NaN : kgToL(kg);
      var c = parseInt(document.getElementById("eCount").value, 10);
      var t = document.getElementById("eTs").value;
      if (isNaN(a) && isNaN(kg) && isNaN(c)) { toast("数値を入力してください"); return; }
      if (!t) { toast("日時を入力してください"); return; }

      rec.addedL = isNaN(a) ? 0 : a;
      rec.literL = isNaN(l) ? 0 : l;
      rec.count = isNaN(c) ? 0 : c;
      rec.ts = new Date(t).toISOString();
      rec.synced = false;              // 同期でシートの同じ行が書き換わる
      saveState();
      closeQrSheet();
      renderMain();
      toast("修正しました");
      if (syncConfigured()) {
        runSync({ rerender: false }).then(function (ok) {
          if (ok) { renderMain(); toast("スプレッドシートに反映しました"); }
        });
      }
    };
  }

  function isoToLocalInput(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
      "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  // 掲示用ポスター。QRは端末の同期設定から作るので、貼り紙と設定が必ず一致する。
  function openPoster(link) {
    var svg = QR.toSvg(link);
    if (!svg) { toast("リンクが長すぎてQRコードを作れませんでした"); return; }
    var el = document.getElementById("posterSheet");
    el.innerHTML =
      '<div class="poster-actions">' +
      '  <button class="btn-secondary" id="posterPrintBtn" type="button">印刷する</button>' +
      '  <button class="btn-secondary" id="posterCloseBtn" type="button">閉じる</button>' +
      '</div>' +
      '<div class="poster">' +
      '  <p class="p-eyebrow">ゾール回収量測定</p>' +
      '  <h2>回収したら<br>スマホで記録してください</h2>' +
      '  <p class="p-lead">紙のチェック用紙の代わりに、スマートフォンから追加量・回収量・回転数を入力します。' +
      '    入力した内容は自動でスプレッドシートにまとまります。</p>' +
      '  <div class="p-qr-block">' +
      '    <div class="p-qr">' + svg + '</div>' +
      '    <div class="p-qr-side">' +
      '      <div class="p-big">スマホのカメラで<br>読み取ってください</div>' +
      '      <div class="p-small">初回の設定は不要です。読み取るだけで記録を始められます。</div>' +
      '    </div>' +
      '  </div>' +
      '  <h3>記録のしかた</h3>' +
      '  <ol>' +
      '    <li>QRコードを読み取ってアプリを開く</li>' +
      '    <li><b>工場を選択してください</b></li>' +
      '    <li>作業した<b>機械のボタン</b>を選ぶ</li>' +
      '    <li><b>追加量 (L)</b>・<b>回収量 (kg)</b>・<b>回転数</b> を入力する</li>' +
      '    <li><b>記録する</b> をタップ</li>' +
      '  </ol>' +
      '  <div class="p-note"><b>電波がなくても大丈夫です</b>' +
      '    記録はまずスマホの中に保存され、電波が戻ったときに自動でスプレッドシートへ送られます。' +
      '    画面の上に「未送信 ◯件」と出ているときは、電波の良い場所でアプリを開いてください。' +
      '    その表示をタップすると手動で送ることもできます。</div>' +
      '  <div class="p-warn">この紙のQRコードには接続用の合言葉が入っています。' +
      '    社外の人の目に触れる場所には貼らないでください。</div>' +
      '</div>';
    el.classList.add("show");
    document.getElementById("posterCloseBtn").onclick = closePoster;
    document.getElementById("posterPrintBtn").onclick = function () { window.print(); };
    document.addEventListener("keydown", posterEscHandler);
    document.getElementById("posterCloseBtn").focus();
  }
  function posterEscHandler(e) { if (e.key === "Escape") closePoster(); }
  function closePoster() {
    var el = document.getElementById("posterSheet");
    el.classList.remove("show");
    el.innerHTML = "";
    document.removeEventListener("keydown", posterEscHandler);
  }

  function qrEscHandler(e) { if (e.key === "Escape") closeQrSheet(); }
  function closeQrSheet() {
    var el = document.getElementById("qrSheet");
    el.classList.remove("show");
    el.innerHTML = "";
    document.removeEventListener("keydown", qrEscHandler);
  }

  // ================= TAB SWITCH =================
  function renderMain() {
    if (activeTab === "record") renderRecordTab();
    else if (activeTab === "history") renderHistoryTab();
    else renderSettingsTab();
    renderSyncPill();
  }

  document.querySelectorAll(".tab-btn").forEach(function (btn) {
    btn.onclick = function () {
      activeTab = btn.getAttribute("data-tab");
      document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.toggle("active", b === btn); });
      renderMain();
    };
  });

  document.getElementById("syncPill").onclick = function () {
    if (!syncConfigured()) {
      activeTab = "settings";
      document.querySelectorAll(".tab-btn").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-tab") === "settings");
      });
      renderMain();
      return;
    }
    runSync({ loud: true });
  };

  renderFactorySelect();
  renderMain();
  renderSyncPill();

  if (syncConfigured()) runSync({});
  window.addEventListener("online", function () { if (syncConfigured()) runSync({}); });
})();
</script>
